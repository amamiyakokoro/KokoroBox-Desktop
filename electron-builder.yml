appId: com.amamiyakokoro.app
productName: KokoroBox
directories:
  buildResources: build
files:
  - '!dist{,/**/*}'
  - '!electron-builder*.yml'
  - '!**/*.{p12,pfx,p8,keychain,keychain-db,mobileprovision,provisionprofile}'
  - '!**/.vscode/*'
  - '!src/*'
  - '!aur/*'
  - '!images/*'
  - '!scripts/*'
  - '!extra/*'
  - '!tailwind.config.js'
  - '!postcss.config.js'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
extraResources:
  - from: './extra/'
    to: ''
  - from: './THIRD_PARTY_NOTICES.md'
    to: 'THIRD_PARTY_NOTICES.md'
protocols:
  name: 'KokoroBox URI Scheme'
  schemes:
    - 'clash'
    - 'mihomo'
    - 'sparkle'
    - 'kokoro'
win:
  executableName: KokoroBox
  target:
    - nsis
    - 7z
  artifactName: ${name}-windows-${version}-${arch}-portable.${ext}
nsis:
  artifactName: ${name}-windows-${version}-${arch}-setup.${ext}
  shortcutName: KokoroBox
  uninstallDisplayName: ${productName}
  allowToChangeInstallationDirectory: true
  oneClick: false
  perMachine: true
  createDesktopShortcut: false
  include: build/installer.nsh
mac:
  target:
    - pkg
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: true
  artifactName: ${name}-macos-${version}-${arch}.${ext}
pkg:
  installLocation: /Applications
  allowAnywhere: false
  allowCurrentUserHome: false
  # background:
  #   alignment: bottomleft
  #   file: build/background.png
linux:
  # Preserve the executable expected by the upstream install/service scripts.
  executableName: sparkle
  desktop:
    entry:
      Name: KokoroBox
      MimeType: 'x-scheme-handler/clash;x-scheme-handler/mihomo;x-scheme-handler/sparkle;x-scheme-handler/kokoro'
  target:
    - deb
    - rpm
    - pacman
  maintainer: KokoroBox contributors <10204811+PhoenixEmik@users.noreply.github.com>
  category: Utility
  artifactName: ${name}-linux-${version}-${arch}.${ext}
deb:
  fpm:
    - --before-install=build/linux/preinst
  afterInstall: 'build/linux/postinst'
  depends:
    - libasound2
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
  recommends:
    - libappindicator3-1
rpm:
  fpm:
    - --before-install=build/linux/preinst
  afterInstall: 'build/linux/postinst'
  afterRemove: 'build/linux/postrm'
  # SONAME capabilities avoid Fedora/Rocky versus openSUSE package-name differences.
  # Both supported RPM architectures (x64 and arm64) use the (64bit) suffix.
  depends:
    - 'libasound.so.2()(64bit)'
    - 'libgtk-3.so.0()(64bit)'
    - 'libgbm.so.1()(64bit)'
    - 'libnotify.so.4()(64bit)'
    - 'libnss3.so()(64bit)'
    - 'libXss.so.1()(64bit)'
    - 'libXtst.so.6()(64bit)'
    - xdg-utils
    - at-spi2-core
    - 'libatspi.so.0()(64bit)'
    - 'libuuid.so.1()(64bit)'
    - 'libsecret-1.so.0()(64bit)'
pacman:
  afterInstall: 'build/linux/postinst'
  fpm:
    - --before-install=build/linux/preinst
    - --pacman-compression
    - zstd
    - build/linux/sparkle.sh=/usr/bin/sparkle
  depends:
    - alsa-lib
    - gtk3
    - libnotify
    - nss
    - libxss
    - libxtst
    - xdg-utils
    - at-spi2-core
    - util-linux-libs
    - libsecret
  artifactName: ${name}-linux-${version}-${arch}.pkg.tar.zst
npmRebuild: true
publish: []
