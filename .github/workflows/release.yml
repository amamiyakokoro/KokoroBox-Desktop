name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (for example 2.26.8); defaults to package.json'
        required: false
        type: string
      tag:
        description: 'Matching version tag; defaults to v<version>'
        required: false
        type: string
  schedule:
    # Optional: set the repository variable ENABLE_MONTHLY_RELEASE=true.
    - cron: '0 4 28-31 * *'
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name != 'schedule' || vars.ENABLE_MONTHLY_RELEASE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Determine Release Version
        id: release
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: node scripts/release-plan.ts
      - name: Check Existing Release and Tag
        if: steps.release.outputs.should_release == 'true'
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            try {
              const { data } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
              if (!data.draft) throw new Error('This version is already published. Use a new version.');
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            try {
              const { data } = await github.rest.repos.getCommit({ ...context.repo, ref: `refs/tags/${tag}` });
              if (data.sha !== context.sha) throw new Error('The release tag points to a different commit. Dispatch from that tag or choose a new version.');
            } catch (error) {
              if (error.status !== 404) throw error;
            }

  build:
    if: needs.prepare.outputs.should_release == 'true'
    needs: prepare
    uses: ./.github/workflows/build.yml
    secrets:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CSC_INSTALLER_LINK: ${{ secrets.CSC_INSTALLER_LINK }}
      CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.CSC_INSTALLER_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    with:
      channel: stable
      version: ${{ needs.prepare.outputs.version }}
      release_tag: ${{ needs.prepare.outputs.tag }}

  publish:
    needs: [prepare, build]
    permissions:
      contents: write
    uses: ./.github/workflows/publish.yml
    with:
      channel: stable
      version: ${{ needs.prepare.outputs.version }}
      release_tag: ${{ needs.prepare.outputs.tag }}
