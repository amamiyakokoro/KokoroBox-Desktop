name: Service hot reload and profile switching

on:
  pull_request:
    paths: &reload_paths
      - '.github/workflows/service-hot-reload.yml'
      - 'scripts/verify-service-reload.cjs'
      - 'scripts/test-profile-*.ts'
      - 'scripts/test-app-config-recovery.ts'
      - 'scripts/test-override-execution.ts'
      - 'scripts/test-override-refresh.ts'
      - 'scripts/test-kokoro-rule-save.ts'
      - 'scripts/test-merge.ts'
      - 'scripts/test-yaml.ts'
      - 'scripts/test-managed-id.ts'
      - 'scripts/test-service-contract.ts'
      - 'scripts/test-settings.ts'

      # Candidate generation, profile persistence, validation and core lifecycle.
      - 'src/main/core/subscription-reload.ts'
      - 'src/main/core/profile*.ts'
      - 'src/main/core/factory.ts'
      - 'src/main/core/manager.ts'
      - 'src/main/core/mihomoApi.ts'
      - 'src/main/core/override-*.ts'
      - 'src/main/core/startup-chain.ts'
      - 'src/main/core/coreHookPath.ts'
      - 'src/main/core/service-core-runtime.ts'
      - 'src/main/config/profile*.ts'
      - 'src/main/config/controledMihomo.ts'
      - 'src/main/config/override.ts'
      - 'src/main/config/app.ts'
      - 'src/main/config/app-loader.ts'
      - 'src/main/config/atomic-file.ts'
      - 'src/main/config/index.ts'
      - 'src/main/app-routing/config.ts'
      - 'src/main/app-routing/profile.ts'
      - 'src/main/kokoro/client.ts'
      - 'src/main/kokoro/profile-check.ts'
      - 'src/main/kokoro/rule-save.ts'
      - 'src/main/service/api.ts'
      - 'src/main/service/contract.ts'
      - 'src/main/service/key.ts'
      - 'src/main/service/fallback.ts'
      - 'src/main/utils/age.ts'
      - 'src/main/utils/dirs.ts'
      - 'src/main/utils/merge.ts'
      - 'src/main/utils/pinnedHttpsAgent.ts'
      - 'src/main/utils/template.ts'
      - 'src/main/utils/userAgent.ts'
      - 'src/main/utils/yaml.ts'
      - 'src/shared/app-routing.ts'
      - 'src/shared/core-validation.ts'
      - 'src/shared/managed-id.ts'
      - 'src/shared/profile-update.ts'
      - 'src/shared/kokoro-subscription-settings.ts'
      - 'src/shared/types/app.d.ts'
      - 'src/shared/types/controller.d.ts'
      - 'src/shared/types/mihomo.d.ts'
      - 'src/shared/types/types.d.ts'

      # Scheduler, IPC and UI entry points for refresh, selection and apply.
      - 'src/main/index.ts'
      - 'src/main/utils/ipc.ts'
      - 'src/main/resolve/deepLink.ts'
      - 'src/main/resolve/tray.ts'
      - 'src/renderer/src/components/mihomo/core-log-setting.tsx'
      - 'src/renderer/src/components/override/edit-*-modal.tsx'
      - 'src/renderer/src/components/override/override-item.tsx'
      - 'src/renderer/src/components/profiles/edit-*-modal.tsx'
      - 'src/renderer/src/components/profiles/kokoro-subscription-modal.tsx'
      - 'src/renderer/src/components/profiles/profile-item.tsx'
      - 'src/renderer/src/components/settings/network/mihomo-settings.tsx'
      - 'src/renderer/src/components/settings/subscription-integration-settings.tsx'
      - 'src/renderer/src/components/sider/outbound-mode-switcher.tsx'
      - 'src/renderer/src/components/sider/profile-card.tsx'
      - 'src/renderer/src/hooks/use-app-config.tsx'
      - 'src/renderer/src/hooks/use-controled-mihomo-config.tsx'
      - 'src/renderer/src/hooks/use-override-config.tsx'
      - 'src/renderer/src/hooks/use-profile-config.tsx'
      - 'src/renderer/src/pages/override.tsx'
      - 'src/renderer/src/pages/profiles.tsx'
      - 'src/renderer/src/utils/ipc.ts'
      - 'src/renderer/src/utils/override.ts'

      # Dependencies used to install and run the TypeScript Service harness.
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'tsconfig.node.json'
  push:
    branches: [master]
    paths: *reload_paths

permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --global pnpm@11.1.1
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Fetch pinned Service and Mihomo
        shell: python
        run: |
          import gzip, hashlib, io, pathlib, sys, urllib.request, zipfile
          root = pathlib.Path('test-bin')
          root.mkdir()
          target, service_sha, mihomo_sha = {
              'win32': ('windows-amd64-v3', 'dcb3273d0138977dd3881aa9623da3075efb9f2820749f577d8757665b4c2270', 'ace63713ea5137d7fcc58c1434b7dee15bccf77457573c84ff2c14b8fb7f07d6'),
              'linux': ('linux-amd64-v3', '64e7ff3fcde67c509a71148c6dca224285af8607240f127ed0b9d2400565fb5f', 'a97b21d7afe5939398b5be2901c30923e8a3f1b112a4733ced5a721630a09b67'),
              'darwin': ('darwin-arm64', '0ce3f3e2e505205eba400d1f7e022d719304deea603845a1596d5d1cb20af228', '1a7a20eca63fbbaec90137717465bfde488d0db2a3a79b8fadebf9b2545b6e4c'),
          }[sys.platform]
          windows = sys.platform == 'win32'
          ext = '.exe' if windows else ''
          def fetch(repo, tag, asset, sha):
              url = f'https://github.com/{repo}/releases/download/{tag}/{asset}'
              with urllib.request.urlopen(url, timeout=90) as response:
                  data = response.read()
              assert hashlib.sha256(data).hexdigest() == sha, asset
              return data
          def install(name, data):
              target = root / (name + ext)
              target.write_bytes(data)
              target.chmod(0o755)
          service = fetch('amamiyakokoro/kokorobox-service', 'v0.6.18', f'kokorobox-service-{target}{ext}', service_sha)
          install('kokorobox-service', service)
          archive = fetch('MetaCubeX/mihomo', 'v1.19.34', f'mihomo-{target}-v1.19.34.' + ('zip' if windows else 'gz'), mihomo_sha)
          if windows:
              with zipfile.ZipFile(io.BytesIO(archive)) as package:
                  [exe] = [entry for entry in package.namelist() if entry.lower().endswith('.exe')]
                  install('mihomo', package.read(exe))
          else:
              install('mihomo', gzip.decompress(archive))
      - name: Verify Service updates, PATCH, profile switches and rollback
        run: node scripts/verify-service-reload.cjs
      - name: Linux Service diagnostics
        if: failure() && runner.os == 'Linux'
        run: |
          sudo journalctl --unit=kokorobox-hot-reload -n 45 --no-pager
          sudo tail -c 12000 /tmp/kokorobox-service.log || true
      - name: Windows Service diagnostics
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Content "$env:SystemRoot/Temp/kokorobox-service.log" -Tail 100 -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: service-reload-${{ runner.os }}
          path: service-reload-results.json
          if-no-files-found: warn
