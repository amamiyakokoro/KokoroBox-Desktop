name: Rolling

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/issues.yml'

permissions:
  contents: read

concurrency:
  group: rolling-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Determine Rolling Version
        id: release
        env:
          RELEASE_EVENT: rolling
        run: node scripts/release-plan.ts

  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      channel: rolling
      version: ${{ needs.prepare.outputs.version }}
      release_tag: rolling

  publish:
    needs: [prepare, build]
    permissions:
      contents: write
    uses: ./.github/workflows/publish.yml
    with:
      channel: rolling
      version: ${{ needs.prepare.outputs.version }}
      release_tag: rolling
