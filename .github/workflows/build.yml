name: Build

on:
  workflow_call:
    inputs:
      channel:
        description: 'Build channel'
        required: true
        type: string
      version:
        description: 'Exact package version, including the rolling suffix when applicable'
        required: true
        type: string
      release_tag:
        description: 'GitHub Release tag containing the artifacts'
        required: true
        type: string
    secrets:
      CSC_LINK:
        required: true
      CSC_KEY_PASSWORD:
        required: true
      CSC_INSTALLER_LINK:
        required: true
      CSC_INSTALLER_KEY_PASSWORD:
        required: true
      APPLE_ID:
        required: true
      APPLE_APP_SPECIFIC_PASSWORD:
        required: true
      APPLE_TEAM_ID:
        required: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install -g pnpm@11.1.1
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test:release
      - run: pnpm test:macos-signing
      - run: pnpm test:kokoro
      - run: pnpm test:localization
      - run: pnpm test:override-user-agent
      - run: pnpm test:app-routing
      - run: pnpm typecheck

  build:
    needs: validate
    if: >-
      github.repository == 'amamiyakokoro/KokoroBox-Desktop' &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')) &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      SKIP_PREPARE: '1'
      RELEASE_VERSION: ${{ inputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            format: 7z
          - os: windows-latest
            arch: x64
            format: nsis
          - os: windows-latest
            arch: arm64
            format: 7z
          - os: windows-latest
            arch: arm64
            format: nsis

          - os: ubuntu-latest
            arch: x64
            format: deb
          - os: ubuntu-latest
            arch: x64
            format: rpm
          - os: ubuntu-latest
            arch: x64
            format: pacman
          - os: ubuntu-latest
            arch: arm64
            format: deb
          - os: ubuntu-latest
            arch: arm64
            format: rpm
          - os: ubuntu-latest
            arch: arm64
            format: pacman

          - os: macos-latest
            arch: x64
            format: pkg
          - os: macos-latest
            arch: arm64
            format: pkg

    name: Build ${{ matrix.os }}-${{ matrix.arch }}${{ matrix.format && '-' || '' }}${{ matrix.format || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Go for KokoroBox Runner
        if: matrix.os == 'windows-latest'
        uses: actions/setup-go@v6
        with:
          go-version-file: build/windows/runner/go.mod
          cache: false

      - name: Setup pnpm
        run: npm install -g pnpm@11.1.1

      - name: Determine and Update Version
        env:
          BUILD_CHANNEL: ${{ inputs.channel }}
        shell: bash
        run: |
          case "$BUILD_CHANNEL" in
            stable)
              if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$ ]]; then
                echo "Invalid stable version"
                exit 1
              fi
              ;;
            rolling)
              if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rolling-[0-9a-f]{7}$ ]]; then
                echo "Invalid rolling version"
                exit 1
              fi
              ;;
            *)
              echo "Invalid build channel: $BUILD_CHANNEL"
              exit 1
              ;;
          esac

          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-([0-9]+|rolling-[0-9a-f]{7}))?$ ]]; then
            echo "Invalid release version: $RELEASE_VERSION"
            exit 1
          fi

          jq --arg version "$RELEASE_VERSION" '.version = $version' package.json > tmp.json && mv tmp.json package.json

      - name: Install Build Tools
        if: matrix.os == 'ubuntu-latest' && matrix.format == 'pacman'
        run: |
          sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: Build Windows x64 Application Routing Sidecar
        if: matrix.os == 'windows-latest' && matrix.arch == 'x64'
        shell: pwsh
        run: ./scripts/build-proxybridge.ps1

      - name: Install Dependencies and Prepare
        env:
          npm_config_arch: ${{ matrix.arch }}
          npm_config_target_arch: ${{ matrix.arch }}
        shell: bash
        run: |
          case "${{ matrix.os }}-${{ matrix.arch }}" in
            windows-latest-x64) PNPM_TARGET_FLAGS="--os=current --os=win32 --cpu=current --cpu=x64"; SPARKLE_NATIVE_PACKAGE="@uruhalushia/sparkle-native-win32-x64-msvc" ;;
            windows-latest-arm64) PNPM_TARGET_FLAGS="--os=current --os=win32 --cpu=current --cpu=arm64"; SPARKLE_NATIVE_PACKAGE="@uruhalushia/sparkle-native-win32-arm64-msvc" ;;
            ubuntu-latest-x64) PNPM_TARGET_FLAGS="--os=current --os=linux --cpu=current --cpu=x64 --libc=current --libc=glibc"; SPARKLE_NATIVE_PACKAGE="@uruhalushia/sparkle-native-linux-x64-gnu" ;;
            ubuntu-latest-arm64) PNPM_TARGET_FLAGS="--os=current --os=linux --cpu=current --cpu=arm64 --libc=current --libc=glibc"; SPARKLE_NATIVE_PACKAGE="@uruhalushia/sparkle-native-linux-arm64-gnu" ;;
            macos-latest-x64) PNPM_TARGET_FLAGS="--os=current --os=darwin --cpu=current --cpu=x64"; SPARKLE_NATIVE_PACKAGE="@uruhalushia/sparkle-native-darwin-x64" ;;
            macos-latest-arm64) PNPM_TARGET_FLAGS="--os=current --os=darwin --cpu=current --cpu=arm64"; SPARKLE_NATIVE_PACKAGE="@uruhalushia/sparkle-native-darwin-arm64" ;;
            *) echo "Unsupported native target: ${{ matrix.os }}-${{ matrix.arch }}" && exit 1 ;;
          esac
          pnpm install --frozen-lockfile $PNPM_TARGET_FLAGS

          verify_native_package() {
            node -e "require('node:module').createRequire(require.resolve(process.argv[1])).resolve(process.argv[2].trim() + '/package.json')" "$1" "$2"
          }
          ensure_native_package() {
            local root_package="$1"
            local native_package="$2"
            if ! verify_native_package "$root_package" "$native_package"; then
              local package_version
              package_version=$(node -p "require('./node_modules/${root_package}/package.json').version")
              SKIP_PREPARE=1 pnpm add "$native_package@$package_version" -D --ignore-scripts $PNPM_TARGET_FLAGS
            fi
          }
          prune_native_packages() {
            node -e "const fs=require('node:fs');const path=require('node:path');const root=process.argv[1].trim();const prefix=process.argv[2].trim();const target=process.argv[3].trim();const keep=target.split('/').pop();const base=path.dirname(path.dirname(require.resolve(root + '/package.json')));for(const name of fs.readdirSync(base)){if(name.startsWith(prefix)&&name!==keep)fs.rmSync(path.join(base,name),{recursive:true,force:true});}const store=path.join(process.cwd(),'node_modules','.pnpm');const storePrefix=root.replace('/','+')+'-';for(const name of fs.readdirSync(store)){if(name.startsWith(storePrefix)&&!name.startsWith(root.replace('/','+')+'-'+keep.slice(prefix.length)+'@'))fs.rmSync(path.join(store,name),{recursive:true,force:true});}" "$1" "$2" "$3"
          }

          ensure_native_package "@uruhalushia/sparkle-native" "$SPARKLE_NATIVE_PACKAGE"
          prune_native_packages "@uruhalushia/sparkle-native" "sparkle-native-" "$SPARKLE_NATIVE_PACKAGE"
          verify_native_package "@uruhalushia/sparkle-native" "$SPARKLE_NATIVE_PACKAGE" \
            || (echo "Missing $SPARKLE_NATIVE_PACKAGE. pnpm must install cross-platform optional native dependencies." && exit 1)
          SKIP_PREPARE=0 pnpm prepare --${{ matrix.arch }}

      - name: Build
        env:
          npm_config_arch: ${{ matrix.arch }}
          npm_config_target_arch: ${{ matrix.arch }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            pnpm build:win ${{ matrix.format }} --${{ matrix.arch }}
          elif [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            pnpm build:linux ${{ matrix.format }} --${{ matrix.arch }}
          else
            # Compile without secrets; packaging/signing runs in the isolated step below.
            pnpm exec electron-vite build
          fi

      - name: Verify Windows x64 Application Routing Payload
        if: matrix.os == 'windows-latest' && matrix.arch == 'x64'
        shell: pwsh
        run: |
          $required = @(
            "ProxyBridge_CLI.exe",
            "ProxyBridgeCore.dll",
            "WinDivert.dll",
            "WinDivert64.sys",
            "LICENSE.ProxyBridge.txt",
            "LICENSE.WinDivert.txt"
          )
          foreach ($name in $required) {
            $matches = @(Get-ChildItem dist -Recurse -File -Filter $name)
            if ($matches.Count -eq 0) { throw "Missing packaged application routing file: $name" }
          }

      - name: Sign and Notarize macOS PKG
        if: matrix.os == 'macos-latest'
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_INSTALLER_LINK: ${{ secrets.CSC_INSTALLER_LINK }}
          CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.CSC_INSTALLER_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/macos-signing.ts release

      - name: Clean Up macOS Signing Credentials
        if: always() && matrix.os == 'macos-latest' && env.MACOS_SIGNING_DIR != ''
        run: node scripts/macos-signing.ts cleanup

      - name: Add Portable Flag
        if: matrix.os == 'windows-latest' && matrix.format == '7z'
        shell: pwsh
        run: |
          New-Item -Path "PORTABLE" -ItemType File
          Get-ChildItem dist/*portable.7z | ForEach-Object {
            7z a $_.FullName PORTABLE
            if ($LASTEXITCODE -ne 0) { throw "Failed to add portable flag" }
          }

      - name: Stage and Check Artifact
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
          TARGET_FORMAT: ${{ matrix.format }}
        run: node scripts/release-artifacts.ts stage

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.format }}
          path: dist/release-artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  fedora-rpm:
    name: Fedora ${{ matrix.fedora }} RPM (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        fedora: ['43', '44']
        arch: [x64, arm64]
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: packages-ubuntu-latest-${{ matrix.arch }}-rpm
          path: fedora-rpm
      - name: Install and smoke-test the release RPM in Fedora
        env:
          FEDORA_VERSION: ${{ matrix.fedora }}
        shell: bash
        run: |
          shopt -s nullglob
          packages=(fedora-rpm/*.rpm)
          test "${#packages[@]}" -eq 1
          docker run --rm --shm-size=256m \
            -v "$PWD/fedora-rpm:/packages:ro" \
            -v "$PWD/scripts:/checks:ro" \
            "registry.fedoraproject.org/fedora:${FEDORA_VERSION}" \
            bash /checks/check-fedora-rpm.sh "/packages/${packages[0]##*/}"
