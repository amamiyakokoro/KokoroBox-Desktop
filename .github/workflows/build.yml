name: Build

on:
  workflow_call:
    inputs:
      channel:
        description: 'Build channel'
        required: true
        type: string
      version:
        description: 'Exact package version, including the rolling suffix when applicable'
        required: true
        type: string
      release_tag:
        description: 'GitHub Release tag containing the artifacts'
        required: true
        type: string
    secrets:
      CSC_LINK:
        required: true
      CSC_KEY_PASSWORD:
        required: true
      CSC_INSTALLER_LINK:
        required: true
      CSC_INSTALLER_KEY_PASSWORD:
        required: true
      APPLE_ID:
        required: true
      APPLE_APP_SPECIFIC_PASSWORD:
        required: true
      APPLE_TEAM_ID:
        required: true
      MACOS_APP_PROVISIONING_PROFILE:
        required: true
      MACOS_EXTENSION_PROVISIONING_PROFILE:
        required: true
      SPARKLE_PRIVATE_ED_KEY:
        required: true
      SPARKLE_PUBLIC_ED_KEY:
        required: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install -g pnpm@11.1.1
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test:release
      - run: pnpm test:macos-signing
      - run: pnpm test:macos-sparkle
      - run: pnpm test:kokoro
      - run: pnpm test:localization
      - run: pnpm test:override-user-agent
      - run: pnpm test:pinned-https-agent
      - run: pnpm test:main-process-errors
      - run: pnpm test:app-routing
      - run: pnpm test:dns
      - run: pnpm test:service-auth
      - run: pnpm typecheck

  validate-traffic-monitor-plugin:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build KokoroBox TrafficMonitor plugin
        shell: pwsh
        run: >-
          ./native/windows/traffic-monitor/build.ps1
          -TargetArch ${{ matrix.arch }}
          -OutputDir "$env:RUNNER_TEMP/traffic-monitor-plugin"
      - name: Verify plugin export
        shell: pwsh
        run: |
          $plugin = "$env:RUNNER_TEMP/traffic-monitor-plugin/KokoroBoxTrafficPlugin.dll"
          if (-not (Test-Path $plugin)) { throw "TrafficMonitor plugin was not built" }
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "Visual Studio locator was not found" }
          $dumpbin = & $vswhere -latest -products * -find "VC/Tools/MSVC/**/bin/Hostx64/x64/dumpbin.exe" |
            Select-Object -First 1
          if (-not $dumpbin) { throw "Visual Studio dumpbin was not found" }
          $exports = & $dumpbin /exports $plugin
          if (-not ($exports -match "TMPluginGetInstance")) {
            throw "Missing TMPluginGetInstance export"
          }

  build:
    needs: [validate, validate-traffic-monitor-plugin]
    if: >-
      github.repository == 'amamiyakokoro/KokoroBox-Desktop' &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')) &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    runs-on: ${{ matrix.runner || matrix.os }}
    timeout-minutes: 150
    env:
      SKIP_PREPARE: '1'
      RELEASE_VERSION: ${{ inputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            format: nsis
          - os: windows-latest
            arch: arm64
            format: nsis

          - os: ubuntu-latest
            arch: x64
            format: deb
          - os: ubuntu-latest
            arch: x64
            format: rpm
          - os: ubuntu-latest
            arch: x64
            format: pacman
          - os: ubuntu-latest
            arch: arm64
            format: deb
          - os: ubuntu-latest
            arch: arm64
            format: rpm
          - os: ubuntu-latest
            arch: arm64
            format: pacman

          - os: macos-latest
            runner: macos-15-intel
            arch: x64
            format: pkg
          - os: macos-latest
            runner: macos-latest
            arch: arm64
            format: pkg

    name: Build ${{ matrix.os }}-${{ matrix.arch }}${{ matrix.format && '-' || '' }}${{ matrix.format || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        run: npm install -g pnpm@11.1.1

      - name: Determine and Update Version
        env:
          BUILD_CHANNEL: ${{ inputs.channel }}
        shell: bash
        run: |
          case "$BUILD_CHANNEL" in
            stable)
              if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$ ]]; then
                echo "Invalid stable version"
                exit 1
              fi
              ;;
            rolling)
              if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rolling-[0-9a-f]{7}$ ]]; then
                echo "Invalid rolling version"
                exit 1
              fi
              ;;
            *)
              echo "Invalid build channel: $BUILD_CHANNEL"
              exit 1
              ;;
          esac

          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-([0-9]+|rolling-[0-9a-f]{7}))?$ ]]; then
            echo "Invalid release version: $RELEASE_VERSION"
            exit 1
          fi

          jq --arg version "$RELEASE_VERSION" '.version = $version' package.json > tmp.json && mv tmp.json package.json

      - name: Install Build Tools
        if: matrix.os == 'ubuntu-latest' && matrix.format == 'pacman'
        run: |
          sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: Install Dependencies and Prepare
        env:
          npm_config_arch: ${{ matrix.arch }}
          npm_config_target_arch: ${{ matrix.arch }}
        shell: bash
        run: |
          case "${{ matrix.os }}-${{ matrix.arch }}" in
            windows-latest-x64) PNPM_TARGET_FLAGS="--os=current --os=win32 --cpu=current --cpu=x64"; KOKOROBOX_NATIVE_PACKAGE="kokorobox-native-win32-x64-msvc" ;;
            windows-latest-arm64) PNPM_TARGET_FLAGS="--os=current --os=win32 --cpu=current --cpu=arm64"; KOKOROBOX_NATIVE_PACKAGE="kokorobox-native-win32-arm64-msvc" ;;
            ubuntu-latest-x64) PNPM_TARGET_FLAGS="--os=current --os=linux --cpu=current --cpu=x64 --libc=current --libc=glibc"; KOKOROBOX_NATIVE_PACKAGE="kokorobox-native-linux-x64-gnu" ;;
            ubuntu-latest-arm64) PNPM_TARGET_FLAGS="--os=current --os=linux --cpu=current --cpu=arm64 --libc=current --libc=glibc"; KOKOROBOX_NATIVE_PACKAGE="kokorobox-native-linux-arm64-gnu" ;;
            macos-latest-x64) PNPM_TARGET_FLAGS="--os=current --os=darwin --cpu=current --cpu=x64"; KOKOROBOX_NATIVE_PACKAGE="kokorobox-native-darwin-x64" ;;
            macos-latest-arm64) PNPM_TARGET_FLAGS="--os=current --os=darwin --cpu=current --cpu=arm64"; KOKOROBOX_NATIVE_PACKAGE="kokorobox-native-darwin-arm64" ;;
            *) echo "Unsupported native target: ${{ matrix.os }}-${{ matrix.arch }}" && exit 1 ;;
          esac
          pnpm install --frozen-lockfile $PNPM_TARGET_FLAGS

          verify_native_package() {
            node -e "require('node:module').createRequire(require.resolve(process.argv[1])).resolve(process.argv[2].trim() + '/package.json')" "$1" "$2"
          }
          ensure_native_package() {
            local root_package="$1"
            local native_package="$2"
            if ! verify_native_package "$root_package" "$native_package"; then
              local package_version
              package_version=$(node -p "require('./node_modules/${root_package}/package.json').version")
              SKIP_PREPARE=1 pnpm add "$native_package@$package_version" -D --ignore-scripts $PNPM_TARGET_FLAGS
            fi
          }
          prune_native_packages() {
            node -e "const fs=require('node:fs');const path=require('node:path');const root=process.argv[1].trim();const prefix=process.argv[2].trim();const target=process.argv[3].trim();const keep=target.split('/').pop();const base=path.dirname(path.dirname(require.resolve(root + '/package.json')));for(const name of fs.readdirSync(base)){if(name.startsWith(prefix)&&name!==keep)fs.rmSync(path.join(base,name),{recursive:true,force:true});}const store=path.join(process.cwd(),'node_modules','.pnpm');const storePrefix=root.replace('/','+')+'-';for(const name of fs.readdirSync(store)){if(name.startsWith(storePrefix)&&!name.startsWith(root.replace('/','+')+'-'+keep.slice(prefix.length)+'@'))fs.rmSync(path.join(store,name),{recursive:true,force:true});}" "$1" "$2" "$3"
          }

          ensure_native_package "kokorobox-native" "$KOKOROBOX_NATIVE_PACKAGE"
          prune_native_packages "kokorobox-native" "kokorobox-native-" "$KOKOROBOX_NATIVE_PACKAGE"
          verify_native_package "kokorobox-native" "$KOKOROBOX_NATIVE_PACKAGE" \
            || (echo "Missing $KOKOROBOX_NATIVE_PACKAGE. pnpm must install cross-platform optional native dependencies." && exit 1)
          SKIP_PREPARE=0 pnpm prepare --${{ matrix.arch }}

      - name: Build KokoroBox TrafficMonitor plugin
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: >-
          ./native/windows/traffic-monitor/build.ps1
          -TargetArch ${{ matrix.arch }}
          -OutputDir "extra/files/TrafficMonitor/plugins"

      - name: Build
        env:
          npm_config_arch: ${{ matrix.arch }}
          npm_config_target_arch: ${{ matrix.arch }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            pnpm build:win --${{ matrix.arch }}
          elif [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            pnpm build:linux ${{ matrix.format }} --${{ matrix.arch }}
          else
            # Compile without secrets; packaging/signing runs in the isolated step below.
            # The preparation script clones and verifies the revision declared by
            # integrity-manifest.ts so CI cannot drift to a second hard-coded pin.
            pnpm prepare:macos-routing
            pnpm prepare:macos-service
            pnpm prepare:macos-updater
            pnpm exec electron-vite build
          fi

      - name: Verify Windows x64 Application Routing Payload
        if: matrix.os == 'windows-latest' && matrix.arch == 'x64'
        shell: pwsh
        run: |
          $required = @(
            "kokorobox-process-router.exe",
            "ProxyBridgeCore.dll",
            "WinDivert.dll",
            "WinDivert64.sys",
            "LICENSE.ProxyBridge",
            "LICENSE.WinDivert",
            "manifest.json",
            "process-router-sbom.cdx.json"
          )
          foreach ($name in $required) {
            $matches = @(Get-ChildItem dist -Recurse -File -Filter $name)
            if ($matches.Count -eq 0) { throw "Missing packaged application routing file: $name" }
          }

      - name: Sign and Notarize macOS PKG
        if: matrix.os == 'macos-latest'
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_INSTALLER_LINK: ${{ secrets.CSC_INSTALLER_LINK }}
          CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.CSC_INSTALLER_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_APP_PROVISIONING_PROFILE: ${{ secrets.MACOS_APP_PROVISIONING_PROFILE }}
          MACOS_EXTENSION_PROVISIONING_PROFILE: ${{ secrets.MACOS_EXTENSION_PROVISIONING_PROFILE }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/macos-signing.ts release

      - name: Clean Up macOS Signing Credentials
        if: always() && matrix.os == 'macos-latest' && env.MACOS_SIGNING_DIR != ''
        run: node scripts/macos-signing.ts cleanup

      - name: Stage and Check Artifact
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
          TARGET_FORMAT: ${{ matrix.format }}
        run: node scripts/release-artifacts.ts stage

      - name: Upload Artifacts
        id: upload_artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.format }}
          path: dist/release-artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # GitHub's artifact service can accept every blob and then transiently
      # reject FinalizeArtifact. Retry only that failed step; overwrite removes
      # any incomplete artifact reservation left by the first attempt.
      - name: Retry Artifact Upload
        if: steps.upload_artifacts.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.format }}
          path: dist/release-artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true

  fedora-rpm:
    name: Fedora ${{ matrix.fedora }} RPM (x64)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        fedora: ['43', '44']
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: packages-ubuntu-latest-x64-rpm
          path: fedora-rpm
      - name: Install and smoke-test the release RPM in Fedora
        env:
          FEDORA_VERSION: ${{ matrix.fedora }}
        shell: bash
        run: |
          shopt -s nullglob
          packages=(fedora-rpm/*.rpm)
          test "${#packages[@]}" -eq 1
          docker run --rm --shm-size=256m \
            -v "$PWD/fedora-rpm:/packages:ro" \
            -v "$PWD/scripts:/checks:ro" \
            "registry.fedoraproject.org/fedora:${FEDORA_VERSION}" \
            bash /checks/check-fedora-rpm.sh "/packages/${packages[0]##*/}"

  opensuse-rpm:
    name: openSUSE Tumbleweed RPM (x64)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: packages-ubuntu-latest-x64-rpm
          path: opensuse-rpm
      - name: Install and smoke-test the release RPM in openSUSE
        shell: bash
        run: |
          shopt -s nullglob
          packages=(opensuse-rpm/*.rpm)
          test "${#packages[@]}" -eq 1
          docker run --rm --shm-size=256m \
            -v "$PWD/opensuse-rpm:/packages:ro" \
            -v "$PWD/scripts:/checks:ro" \
            registry.opensuse.org/opensuse/tumbleweed:latest \
            bash /checks/check-opensuse-rpm.sh "/packages/${packages[0]##*/}"
